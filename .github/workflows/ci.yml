name: CI - Test & Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  # Write results to branch for agent visibility
  report:
    name: Write Results
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always() && github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Write run log
        run: |
          cat > docs/RUN_LOG.md << 'EOF'
          # CI Run Log

          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}
          **Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Results

          | Step | Status |
          |------|--------|
          | Test | ${{ needs.test.result }} |
          | Build | ${{ needs.build.result }} |

          ## Summary

          EOF

          if [[ "${{ needs.test.result }}" == "success" && "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ **All checks passed.** Ready for merge." >> docs/RUN_LOG.md
          else
            echo "❌ **Failed.** Check workflow logs." >> docs/RUN_LOG.md
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/RUN_LOG.md
          git diff --staged --quiet || git commit -m "CI: Update run log [skip ci]"
          git push
