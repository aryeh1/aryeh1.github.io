name: Build, Test & Deploy

on:
  push:
    branches: [main, 'claude/*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: test
        run: npm run test -- --reporter=verbose 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Build
        id: build
        run: npm run build 2>&1 | tee build-output.txt
        continue-on-error: true

      - name: Log results to branch
        if: always()
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          BRANCH="${GITHUB_REF#refs/heads/}"
          TEST_STATUS="${{ steps.test.outcome }}"
          BUILD_STATUS="${{ steps.build.outcome }}"

          if [ "$TEST_STATUS" = "success" ] && [ "$BUILD_STATUS" = "success" ]; then
            STATUS="PASS"
          else
            STATUS="FAIL"
          fi

          # Create log entry
          LOG_ENTRY="| $TIMESTAMP | $BRANCH | $STATUS | - | Test: $TEST_STATUS, Build: $BUILD_STATUS |"

          echo "## Run: $TIMESTAMP" >> run-result.md
          echo "" >> run-result.md
          echo "**Status**: $STATUS" >> run-result.md
          echo "**Branch**: $BRANCH" >> run-result.md
          echo "" >> run-result.md

          if [ "$TEST_STATUS" != "success" ]; then
            echo "### Test Output" >> run-result.md
            echo '```' >> run-result.md
            tail -50 test-output.txt >> run-result.md
            echo '```' >> run-result.md
          fi

          if [ "$BUILD_STATUS" != "success" ]; then
            echo "### Build Output" >> run-result.md
            echo '```' >> run-result.md
            tail -50 build-output.txt >> run-result.md
            echo '```' >> run-result.md
          fi

      - name: Upload build artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload run result
        uses: actions/upload-artifact@v4
        with:
          name: run-result
          path: run-result.md

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
