<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 - Not Found</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #FAF9F6;
      color: #1C1C1C;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .symbol { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-weight: 300; font-size: 1.5rem; }
    a {
      color: #2D4A3E;
      text-decoration: none;
      display: inline-block;
      margin-top: 1rem;
    }
    a:hover { opacity: 0.7; }
  </style>
</head>
<body>
  <div class="container">
    <div class="symbol">虚</div>
    <h1>Page not found</h1>
    <a href="/">← Return home</a>
  </div>
  <script>
    // Handle SPA routing for GitHub Pages
    const path = window.location.pathname;
    if (path !== '/' && path !== '/404.html') {
      sessionStorage.setItem('redirect', path);
      window.location.replace('/');
    }
  </script>
</body>
</html>
